name: Manual APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to generate'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    name: Build APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Debug APK ──
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: myspoti-debug-apk
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── Release APK ──
      - name: Configure Keystore (if secret provided)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MYSPOTI_KEYSTORE_BASE64 || secrets.MYSPOTI_STABLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            MYSPOTI_KEYSTORE="$RUNNER_TEMP/release.jks" \
            MYSPOTI_KEYSTORE_PASSWORD="${{ secrets.MYSPOTI_KEYSTORE_PASSWORD || secrets.MYSPOTI_STABLE_KEYSTORE_PASSWORD }}" \
            MYSPOTI_KEY_ALIAS="${{ secrets.MYSPOTI_KEY_ALIAS || secrets.MYSPOTI_STABLE_KEY_ALIAS }}" \
            MYSPOTI_KEY_PASSWORD="${{ secrets.MYSPOTI_KEY_PASSWORD || secrets.MYSPOTI_STABLE_KEY_PASSWORD }}" \
            ./gradlew assembleRelease
          else
            ./gradlew assembleRelease
          fi

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: myspoti-release-apk
          path: base/app/build/outputs/apk/release/*.apk
          retention-days: 30
